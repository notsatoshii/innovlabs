server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compress text responses; fonts are woff2 (already compressed) and stay out.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Astro builds a static 404.html; serve it for unknown paths in both locales.
    error_page 404 /404.html;

    # Static assets are content-hashed by Astro; fonts and images rarely change.
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /fonts/  { add_header Cache-Control "public, max-age=604800"; }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff;
    }
}
