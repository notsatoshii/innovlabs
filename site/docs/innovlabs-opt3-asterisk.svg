<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-label="Innovlabs logo, asterisk option">
  <title>Innovlabs — asterisk</title>

  <!-- Lime tile with hard shadow -->
  <rect x="50" y="50" width="160" height="160" fill="#000000"/>
  <rect x="38" y="38" width="160" height="160" fill="#B8FF29" stroke="#000000" stroke-width="6"/>

  <!-- Chunky asterisk: everything experimental gets a footnote -->
  <g transform="translate(118,118)">
    <rect x="-13" y="-56" width="26" height="112" fill="#000000"/>
    <rect x="-13" y="-56" width="26" height="112" fill="#000000" transform="rotate(60)"/>
    <rect x="-13" y="-56" width="26" height="112" fill="#000000" transform="rotate(-60)"/>
    <rect x="-11" y="-11" width="22" height="22" fill="#FF4D8D"/>
  </g>

  <!-- Wordmark with superscript pixel footnote -->
  <text x="228" y="142" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="900" letter-spacing="1" fill="#000000"
        textLength="378" lengthAdjust="spacingAndGlyphs">INNOVLABS</text>
  <rect x="608" y="88" width="16" height="16" fill="#B8FF29" stroke="#000000" stroke-width="5"/>
</svg>
